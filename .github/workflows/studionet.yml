name: Studionet

on:
  workflow_dispatch:
    inputs:
      adjudication:
        description: Run the real LLM adjudication of a vault (slow)
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: studionet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and drive the lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, '[deploy]') ||
      startsWith(github.event.head_commit.message, '[adjudication]')
    permissions:
      contents: write
    env:
      ADJUDICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.adjudication) || startsWith(github.event.head_commit.message, '[adjudication]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy and drive the lifecycle
        env:
          VIGIL_TESTER1_KEYSTORE: ${{ secrets.VIGIL_TESTER1_KEYSTORE }}
          VIGIL_TESTER1_PASSWORD: ${{ secrets.VIGIL_TESTER1_PASSWORD }}
          VIGIL_TESTER2_KEYSTORE: ${{ secrets.VIGIL_TESTER2_KEYSTORE }}
          VIGIL_TESTER2_PASSWORD: ${{ secrets.VIGIL_TESTER2_PASSWORD }}
        run: node scripts/studionet-run.mjs

      - name: Record the contract address
        if: always()
        run: |
          if [ ! -f studionet-run.json ]; then
            echo "No run report; nothing to record."
            exit 0
          fi
          ADDRESS=$(python3 -c "import json;print(json.load(open('studionet-run.json')).get('contractAddress',''))")
          if [ -z "$ADDRESS" ]; then
            echo "The run did not deploy a contract; nothing to record."
            exit 0
          fi
          echo "Recording $ADDRESS"
          node scripts/record-address.mjs "$ADDRESS"

      - name: Commit the recorded address
        if: always()
        run: |
          git config user.name "vigil-keeper"
          git config user.email "vigil-keeper@users.noreply.github.com"
          git add src/lib/genlayer.ts README.md SUBMISSION.md
          if git diff --cached --quiet; then
            echo "The address was already recorded."
            exit 0
          fi
          git commit -m "Record Studionet contract address"
          git push

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studionet-run
          path: studionet-run.json
          if-no-files-found: ignore
